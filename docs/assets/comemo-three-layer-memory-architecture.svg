<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='850' viewBox='0 0 1200 850' role='img' aria-label='comemo Three-Layer Memory Architecture'><defs><marker id='a' markerWidth='9' markerHeight='9' refX='8' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L9,4.5 L0,9 Z' fill='#1e40af'/></marker></defs><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif}.title{font-size:42px;font-weight:800;fill:#0f172a;letter-spacing:.5px}.sub{font-size:22px;fill:#475569;letter-spacing:1px}.h{font-size:28px;font-weight:800}.rh{font-size:25px;font-weight:800}.s{font-size:17px;fill:#111827}.m{font-size:16px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.tag{font-size:15px;font-weight:700;fill:#fff}.note{font-size:18px;font-weight:700;fill:#0f172a}.mini{font-size:15px;fill:#334155}.box{fill:#f8fafc;stroke:#93c5fd}</style><rect width='1200' height='850' fill='#fff'/><text x='600' y='58' class='title' text-anchor='middle'>comemo Three-Layer Memory Architecture</text><text x='600' y='94' class='sub' text-anchor='middle'>Composable Markdown memory for coding agents</text><rect x='20' y='305' width='185' height='220' rx='14' fill='#fff' stroke='#0f172a' stroke-width='2'/><text x='112' y='365' class='h' fill='#0f172a' text-anchor='middle'>Coding</text><text x='112' y='397' class='h' fill='#0f172a' text-anchor='middle'>Agent</text><line x1='35' y1='425' x2='190' y2='425' stroke='#94a3b8'/><text x='112' y='455' class='s' text-anchor='middle'><tspan x='112' dy='0'>Codex / Claude Code</tspan><tspan x='112' dy='21'>Cursor / Aider</tspan><tspan x='112' dy='21'>Gemini CLI</tspan></text><path d='M205 360 H260 V175 H305' fill='none' stroke='#1e40af' stroke-width='3' marker-end='url(#a)'/><path d='M205 410 H305' fill='none' stroke='#0f8a78' stroke-width='3' marker-end='url(#a)'/><path d='M205 470 H255 V588 H305' fill='none' stroke='#6b46c1' stroke-width='3' stroke-dasharray='8 7' marker-end='url(#a)'/><rect x='310' y='125' width='585' height='165' rx='14' fill='#eff6ff' stroke='#2563eb' stroke-width='2'/><circle cx='367' cy='197' r='34' fill='#fff' stroke='#2563eb' stroke-width='2'/><text x='367' y='207' font-size='25' font-weight='800' fill='#2563eb' text-anchor='middle'>L1</text><text x='425' y='170' class='h' fill='#2563eb'>Global Layer</text><rect x='425' y='187' width='250' height='28' rx='6' fill='#e2e8f0' opacity='.8'/><text x='437' y='207' class='m' fill='#2563eb'>~/.codex/AGENTS.md</text><text x='425' y='237' class='s'>• Always-on collaboration rules</text><text x='425' y='261' class='s'>• Long-term memory capture process</text><text x='425' y='285' class='s'>• Shared across projects</text><rect x='775' y='149' width='95' height='34' rx='7' fill='#2563eb'/><text x='822' y='172' class='tag' text-anchor='middle'>Always-on</text><rect x='310' y='310' width='585' height='165' rx='14' fill='#f0fdfa' stroke='#0f8a78' stroke-width='2'/><circle cx='367' cy='382' r='34' fill='#fff' stroke='#0f8a78' stroke-width='2'/><text x='367' y='392' font-size='25' font-weight='800' fill='#0f8a78' text-anchor='middle'>L2</text><text x='425' y='355' class='h' fill='#0f8a78'>Project Layer</text><rect x='425' y='372' width='250' height='28' rx='6' fill='#e2e8f0' opacity='.8'/><text x='437' y='392' class='m' fill='#0f8a78'>&lt;project-root&gt;/AGENTS.md</text><text x='425' y='422' class='s'>• Project facts, workflow, and records</text><text x='425' y='446' class='s'>• Project-specific collaboration rules</text><text x='425' y='470' class='s'>• Immediate context for the current task</text><rect x='775' y='334' width='95' height='34' rx='7' fill='#0f8a78'/><text x='822' y='357' class='tag' text-anchor='middle'>Per-project</text><rect x='310' y='495' width='585' height='190' rx='14' fill='#faf5ff' stroke='#6b46c1' stroke-width='2'/><circle cx='367' cy='567' r='34' fill='#fff' stroke='#6b46c1' stroke-width='2'/><text x='367' y='577' font-size='25' font-weight='800' fill='#6b46c1' text-anchor='middle'>L3</text><text x='425' y='540' class='h' fill='#6b46c1'>Personal Layer</text><rect x='425' y='557' width='250' height='28' rx='6' fill='#e2e8f0' opacity='.8'/><text x='437' y='577' class='m' fill='#6b46c1'>~/comemo/</text><text x='425' y='607' class='s'>• Preferences, goals, abilities, experience, identity</text><text x='425' y='631' class='s'>• Richest context, but not loaded by default</text><text x='425' y='655' class='s'>• Read only when needed</text><rect x='775' y='519' width='95' height='34' rx='7' fill='#6b46c1'/><text x='822' y='542' class='tag' text-anchor='middle'>On-demand</text><rect x='330' y='640' width='540' height='30' rx='6' fill='#fff' stroke='#6b46c1' stroke-dasharray='6 5'/><text x='600' y='660' class='m' fill='#1e1b4b' text-anchor='middle'>preference.md · goals.md · ability.md · experience.md · identity.md</text><rect x='925' y='130' width='250' height='555' rx='14' fill='#fff' stroke='#1e40af' stroke-width='2'/><text x='1050' y='188' class='rh' fill='#1e3a8a' text-anchor='middle'><tspan x='1050' dy='0'>Candidate +</tspan><tspan x='1050' dy='30'>Consolidated Pool</tspan></text><line x1='945' y1='245' x2='1155' y2='245' stroke='#2563eb'/><rect x='960' y='270' width='180' height='42' rx='8' fill='#f8fafc' stroke='#93c5fd'/><text x='1050' y='296' class='s' text-anchor='middle'>Candidate memory</text><path d='M1050 318 V346' fill='none' stroke='#1e40af' stroke-width='3' marker-end='url(#a)'/><rect x='960' y='350' width='180' height='42' rx='8' fill='#f8fafc' stroke='#93c5fd'/><text x='1050' y='376' class='s' text-anchor='middle'>Consolidated context</text><text x='1050' y='430' class='s' fill='#0f172a' font-weight='700' text-anchor='middle'>Custom load target</text><rect x='958' y='452' width='184' height='36' rx='7' fill='#eff6ff' stroke='#2563eb'/><text x='1050' y='475' class='mini' text-anchor='middle'>→ L1 Global Layer</text><rect x='958' y='500' width='184' height='36' rx='7' fill='#f0fdfa' stroke='#0f8a78'/><text x='1050' y='523' class='mini' text-anchor='middle'>→ L2 Project Layer</text><rect x='958' y='548' width='184' height='36' rx='7' fill='#faf5ff' stroke='#6b46c1'/><text x='1050' y='571' class='mini' text-anchor='middle'>→ L3 Personal Layer</text><text x='1050' y='622' class='mini' text-anchor='middle'><tspan x='1050' dy='0'>Not owned by</tspan><tspan x='1050' dy='20'>Personal Layer only</tspan></text><text x='244' y='235' class='s' fill='#1e40af' font-weight='700' text-anchor='middle'>Read by default</text><text x='252' y='392' class='s' fill='#0f8a78' font-weight='700' text-anchor='middle'>Read by default</text><text x='248' y='570' class='s' fill='#6b46c1' font-weight='700' text-anchor='middle'>Read on demand</text><rect x='25' y='705' width='1150' height='78' rx='12' fill='#fff' stroke='#1e40af' stroke-width='2'/><text x='55' y='752' class='h' fill='#0f172a'>How it works</text><rect x='230' y='720' width='120' height='46' rx='7' class='box'/><text x='290' y='750' class='s' text-anchor='middle'>Task starts</text><line x1='357' y1='743' x2='382' y2='743' stroke='#1e40af' stroke-width='3' marker-end='url(#a)'/><rect x='382' y='720' width='120' height='46' rx='7' class='box'/><text x='442' y='750' class='s' text-anchor='middle'>Read L1</text><line x1='509' y1='743' x2='534' y2='743' stroke='#1e40af' stroke-width='3' marker-end='url(#a)'/><rect x='534' y='720' width='120' height='46' rx='7' class='box'/><text x='594' y='750' class='s' text-anchor='middle'>Read L2</text><line x1='661' y1='743' x2='686' y2='743' stroke='#1e40af' stroke-width='3' marker-end='url(#a)'/><rect x='686' y='720' width='150' height='46' rx='7' class='box'/><text x='761' y='750' class='s' text-anchor='middle'>Read L3 on need</text><line x1='843' y1='743' x2='868' y2='743' stroke='#1e40af' stroke-width='3' marker-end='url(#a)'/><rect x='868' y='720' width='130' height='46' rx='7' class='box'/><text x='933' y='750' class='s' text-anchor='middle'>Capture</text><line x1='1005' y1='743' x2='1030' y2='743' stroke='#1e40af' stroke-width='3' marker-end='url(#a)'/><rect x='1030' y='720' width='120' height='46' rx='7' class='box'/><text x='1090' y='750' class='s' text-anchor='middle'>Route</text><text x='600' y='825' class='note' text-anchor='middle'>Core idea: memory stays lean by routing consolidated context to the right layer.</text></svg>