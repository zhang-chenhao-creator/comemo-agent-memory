='14' fill='#eff6ff' stroke='#2563eb' stroke-width='2'/><circle cx='367' cy='197' r='34' fill='#fff' stroke='#2563eb' stroke-width='2'/><text x='367' y='207' font-size='25' font-weight='800' fill='#2563eb' text-anchor='middle'>L1</text><text x='425' y='170' class='h' fill='#2563eb'>全局层</text><rect x='425' y='187' width='250' height='28' rx='6' fill='#e2e8f0' opacity='.8'/><text x='437' y='207' class='m' fill='#2563eb'>~/.codex/AGENTS.md</text><text x='425' y='237' class='s'>• 始终生效的协作规则</text><text x='425' y='261' class='s'>• 长期改进的记忆沉淀流程</text><text x='425' y='285' class='s'>• 跨项目通用</text><rect x='775' y='149' width='95' height='34' rx='7' fill='#2563eb'/><text x='822' y='172' class='tag' text-anchor='middle'>常驻</text><rect x='310' y='310' width='585' height='165' rx='14' fill='#f0fdfa' stroke='#0f8a78' stroke-width='2'/><circle cx='367' cy='382' r='34' fill='#fff' stroke='#0f8a78' stroke-width='2'/><text x='367' y='392' font-size='25' font-weight='800' fill='#0f8a78' text-anchor='middle'>L2</text><text x='425' y='355' class='h' fill='#0f8a78'>项目层</text><rect x='425' y='372' width='250' height='28' rx='6' fill='#e2e8f0' opacity='.8'/><text x='437' y='392' class='m' fill='#0f8a78'>&lt;project-root&gt;/AGENTS.md</text><text x='425' y='422' class='s'>• 项目事实、工作流、记录</text><text x='425' y='446' class='s'>• 项目专属协作原则</text><text x='425' y='470' class='s'>• 当前任务的即时上下文</text><rect x='775' y='334' width='95' height='34' rx='7' fill='#0f8a78'/><text x='822' y='357' class='tag' text-anchor='middle'>按项目</text><rect x='310' y='495' width='585' height='190' rx='14' fill='#faf5ff' stroke='#6b46c1' stroke-width='2'/><circle cx='367' cy='567' r='34' fill='#fff' stroke='#6b46c1' stroke-width='2'/><text x='367' y='577' font-size='25' font-weight='800' fill='#6b46c1' text-anchor='middle'>L3</text><text x='425' y='540' class='h' fill='#6b46c1'>个人层</text><rect x='425' y='557' width='250' height='28' rx='6' fill='#e2e8f0' opacity='.8'/><text x='437' y='577' class='m' fill='#6b46c1'>~/comemo/</text><text x='425' y='607' class='s'>• 长期偏好、目标、能力、经验、身份</text><text x='425' y='631' class='s'>• 信息最丰富，但不默认全量加载</text><text x='425' y='655' class='s'>• 需要时按需读取</text><rect x='775' y='519' width='95' height='34' rx='7' fill='#6b46c1'/><text x='822' y='542' class='tag' text-anchor='middle'>按需</text><rect x='330' y='640' width='540' height='30' rx='6' fill='#fff' stroke='#6b46c1' stroke-dasharray='6 5'/><text x='600' y='660' class='m' fill='#1e1b4b' text-anchor='middle'>偏好.md · 目标.md · 能力.md · 经验.md · 身份.md</text><rect x='925' y='130' width='250' height='555' rx='14' fill='#fff' stroke='#1e40af' stroke-width='2'/><text x='1050' y='188' class='rh' fill='#1e3a8a' text-anchor='middle'><tspan x='1050' dy='0'>候选 + 沉淀池</tspan><tspan x='1050' dy='30'>Candidate Pool</tspan></text><line x1='945' y1='245' x2='1155' y2='245' stroke='#2563eb'/><rect x='960' y='270' width='180' height='42' rx='8' fill='#f8fafc' stroke='#93c5fd'/><text x='1050' y='296' class='s' text-anchor='middle'>候选记忆</text><path d='M1050 318 V346' fill='none' stroke='#1e40af' stroke-width='3' marker-end='url(#a)'/><rect x='960' y='350' width='180' height='42' rx='8' fill='#f8fafc' stroke='#93c5fd'/><text x='1050' y='376' class='s' text-anchor='middle'>沉淀结果</text><text x='1050' y='430' class='s' fill='#0f172a' font-weight='700' text-anchor='middle'>自定义加载目标</text><rect x='958' y='452' width='184' height='36' rx='7' fill='#eff6ff' stroke='#2563eb'/><text x='1050' y='475' class='mini' text-anchor='middle'>→ L1 全局层</text><rect x='958' y='500' width='184' height='36' rx='7' fill='#f0fdfa' stroke='#0f8a78'/><text x='1050' y='523' class='mini' text-anchor='middle'>→ L2 项目层</text><rect x='958' y='548' width='184' height='36' rx='7' fill='#faf5ff' stroke='#6b46c1'/><text x='1050' y='571' class='mini' text-anchor='middle'>→ L3 个人层</text><text x='1050' y='622' class='mini' text-anchor='middle'><tspan x='1050' dy='0'>不默认归入个人层</tspan><tspan x='1050' dy='20'>由用户/规则决定位置</tspan></text><text x='244' y='235' class='s' fill='#1e40af' font-weight='700' text-anchor='middle'>默认读取</text><text x='252' y='392' class='s' fill='#0f8a78' font-weight='700' text-anchor='middle'>默认读取</text><text x='248' y='570' class='s' fill='#6b46c1' font-weight='700' text-anchor='middle'>按需读取</text><rect x='25' y='705' width='1150' height='78' rx='12' fill='#fff' stroke='#1e40af' stroke-width='2'/><text x='55' y='752' class='h' fill='#0f172a'>工作方式</text><rect x='230' y='720' width='120' height='46' rx='7' class='box'/><text x='290' y='750' class='s' text-anchor='middle'>任务开始</text><line x1='357' y1='743' x2='382' y2='743' stroke='#1e40af' stroke-width='3' marker-end='url(#a)'/><rect x='382' y='720' width='120' height='46' rx='7' class='box'/><text x='442' y='750' class='s' text-anchor='middle'>读取 L1</text><line x1='509' y1='743' x2='534' y2='743' stroke='#1e40af' stroke-width='3' marker-end='url(#a)'/><rect x='534' y='720' width='120' height='46' rx='7' class='box'/><text x='594' y='750' class='s' text-anchor='middle'>读取 L2</text><line x1='661' y1='743' x2='686' y2='743' stroke='#1e40af' stroke-width='3' marker-end='url(#a)'/><rect x='686' y='720' width='150' height='46' rx='7' class='box'/><text x='761' y='750' class='s' text-anchor='middle'>按需读取 L3</text><line x1='843' y1='743' x2='868' y2='743' stroke='#1e40af' stroke-width='3' marker-end='url(#a)'/><rect x='868' y='720' width='130' height='46' rx='7' class='box'/><text x='933' y='750' class='s' text-anchor='middle'>捕获候选</text><line x1='1005' y1='743' x2='1030' y2='743' stroke='#1e40af' stroke-width='3' marker-end='url(#a)'/><rect x='1030' y='720' width='120' height='46' rx='7' class='box'/><text x='1090' y='750' class='s' text-anchor='middle'>沉淀路由</text><text x='600' y='825' class='note' text-anchor='middle'>核心理念：记忆保持精简，沉淀内容按需要路由到正确层。</text></svg>