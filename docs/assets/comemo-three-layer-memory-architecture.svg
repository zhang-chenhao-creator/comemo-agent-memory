<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-label="comemo Three-Layer Memory Architecture">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1e40af"/></marker></defs>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;}.title{font-size:42px;font-weight:800;fill:#0f172a;letter-spacing:.5px;}.sub{font-size:22px;fill:#475569;letter-spacing:1px;}.h{font-size:28px;font-weight:800;}.s{font-size:17px;fill:#111827;}.m{font-size:16px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}.tag{font-size:15px;font-weight:700;fill:#fff;}.note{font-size:18px;font-weight:700;fill:#0f172a;}</style>
<rect width="1200" height="850" fill="#fff"/><text x="600" y="58" class="title" text-anchor="middle">comemo Three-Layer Memory Architecture</text><text x="600" y="94" class="sub" text-anchor="middle">Composable Markdown memory for coding agents</text><rect x="20" y="305" width="185" height="220" rx="14" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="112" y="365" class="h" fill="#0f172a" text-anchor="middle">Coding</text><text x="112" y="397" class="h" fill="#0f172a" text-anchor="middle">Agent</text><line x1="35" y1="425" x2="190" y2="425" stroke="#94a3b8"/><text x="112" y="455" class="s" text-anchor="middle"><tspan x="112" dy="0">Codex / Claude Code /</tspan><tspan x="112" dy="21">Cursor / Aider /</tspan><tspan x="112" dy="21">Gemini CLI</tspan></text><path d="M205 360 H270 V180 H320" fill="none" stroke="#1e40af" stroke-width="3" marker-end="url(#a)"/><text x="255" y="235" class="s" fill="#1e40af" font-weight="700" text-anchor="middle">Read by default</text><path d="M205 410 H320" fill="none" stroke="#0f8a78" stroke-width="3" marker-end="url(#a)"/><text x="263" y="392" class="s" fill="#0f8a78" font-weight="700" text-anchor="middle">Read by default</text><path d="M205 470 H260 V590 H320" fill="none" stroke="#6b46c1" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#a)"/><text x="255" y="570" class="s" fill="#6b46c1" font-weight="700" text-anchor="middle">Read on demand</text><rect x="325" y="125" width="595" height="165" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="382" cy="197" r="34" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="382" y="207" font-size="27" font-weight="800" fill="#2563eb" text-anchor="middle">G</text><text x="440" y="170" class="h" fill="#2563eb">Global Layer</text><rect x="440" y="187" width="250" height="28" rx="6" fill="#e2e8f0" opacity=".8"/><text x="452" y="207" class="m" fill="#2563eb">~/.codex/AGENTS.md</text><text x="440" y="237" class="s">• Always-on collaboration rules</text><text x="440" y="261" class="s">• Long-term memory capture process</text><text x="440" y="285" class="s">• Shared across projects</text><rect x="800" y="149" width="95" height="34" rx="7" fill="#2563eb"/><text x="847" y="172" class="tag" text-anchor="middle">Always-on</text><rect x="325" y="310" width="595" height="165" rx="14" fill="#f0fdfa" stroke="#0f8a78" stroke-width="2"/><circle cx="382" cy="382" r="34" fill="#fff" stroke="#0f8a78" stroke-width="2"/><text x="382" y="392" font-size="27" font-weight="800" fill="#0f8a78" text-anchor="middle">P</text><text x="440" y="355" class="h" fill="#0f8a78">Project Layer</text><rect x="440" y="372" width="250" height="28" rx="6" fill="#e2e8f0" opacity=".8"/><text x="452" y="392" class="m" fill="#0f8a78">&lt;project-root&gt;/AGENTS.md</text><text x="440" y="422" class="s">• Project facts, workflow, and records</text><text x="440" y="446" class="s">• Project-specific collaboration rules</text><text x="440" y="470" class="s">• Immediate context for the current task</text><rect x="800" y="334" width="95" height="34" rx="7" fill="#0f8a78"/><text x="847" y="357" class="tag" text-anchor="middle">Per-project</text><rect x="325" y="495" width="595" height="190" rx="14" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/><circle cx="382" cy="567" r="34" fill="#fff" stroke="#6b46c1" stroke-width="2"/><text x="382" y="577" font-size="27" font-weight="800" fill="#6b46c1" text-anchor="middle">C</text><text x="440" y="540" class="h" fill="#6b46c1">Personal Layer</text><rect x="440" y="557" width="250" height="28" rx="6" fill="#e2e8f0" opacity=".8"/><text x="452" y="577" class="m" fill="#6b46c1">~/comemo/</text><text x="440" y="607" class="s">• Preferences, goals, abilities, experience, identity</text><text x="440" y="631" class="s">• Richest context, but not loaded by default</text><text x="440" y="655" class="s">• Read only when needed</text><rect x="800" y="519" width="95" height="34" rx="7" fill="#6b46c1"/><text x="847" y="542" class="tag" text-anchor="middle">On-demand</text><rect x="345" y="640" width="555" height="30" rx="6" fill="#fff" stroke="#6b46c1" stroke-dasharray="6 5"/><text x="622" y="660" class="m" fill="#1e1b4b" text-anchor="middle">preference.md · goals.md · ability.md · experience.md · identity.md</text><rect x="940" y="155" width="235" height="525" rx="14" fill="#fff" stroke="#1e40af" stroke-width="2"/><text x="1057" y="215" class="h" fill="#1e3a8a" text-anchor="middle">Design Principles</text><line x1="960" y1="245" x2="1155" y2="245" stroke="#2563eb"/><circle cx="978" cy="288" r="12" fill="#dbeafe" stroke="#1e40af"/><text x="1005" y="295" class="s" text-anchor="start"><tspan x="1005" dy="0">Markdown as shared</tspan><tspan x="1005" dy="21">source of truth</tspan></text><line x1="960" y1="330" x2="1155" y2="330" stroke="#60a5fa" stroke-dasharray="4 5"/><circle cx="978" cy="378" r="12" fill="#dbeafe" stroke="#1e40af"/><text x="1005" y="385" class="s" text-anchor="start"><tspan x="1005" dy="0">No platform-specific</tspan><tspan x="1005" dy="21">installer</tspan></text><line x1="960" y1="420" x2="1155" y2="420" stroke="#60a5fa" stroke-dasharray="4 5"/><circle cx="978" cy="468" r="12" fill="#dbeafe" stroke="#1e40af"/><text x="1005" y="475" class="s" text-anchor="start"><tspan x="1005" dy="0">No hidden</tspan><tspan x="1005" dy="21">background sync</tspan></text><line x1="960" y1="510" x2="1155" y2="510" stroke="#60a5fa" stroke-dasharray="4 5"/><circle cx="978" cy="558" r="12" fill="#dbeafe" stroke="#1e40af"/><text x="1005" y="565" class="s" text-anchor="start"><tspan x="1005" dy="0">Lightweight, portable,</tspan><tspan x="1005" dy="21">composable</tspan></text><rect x="25" y="705" width="1150" height="75" rx="12" fill="#fff" stroke="#1e40af" stroke-width="2"/><text x="55" y="751" class="h" fill="#0f172a">How it works</text><rect x="250" y="720" width="125" height="46" rx="7" fill="#f8fafc" stroke="#93c5fd"/><text x="312.5" y="750" class="s" text-anchor="middle"><tspan x="312.5" dy="0">Task starts</tspan></text><line x1="382" y1="743" x2="407" y2="743" stroke="#1e40af" stroke-width="3" marker-end="url(#a)"/><rect x="407" y="720" width="145" height="46" rx="7" fill="#f8fafc" stroke="#93c5fd"/><text x="479.5" y="738" class="s" text-anchor="middle"><tspan x="479.5" dy="0">Read</tspan><tspan x="479.5" dy="21">Global Layer</tspan></text><line x1="559" y1="743" x2="584" y2="743" stroke="#1e40af" stroke-width="3" marker-end="url(#a)"/><rect x="584" y="720" width="145" height="46" rx="7" fill="#f8fafc" stroke="#93c5fd"/><text x="656.5" y="738" class="s" text-anchor="middle"><tspan x="656.5" dy="0">Read</tspan><tspan x="656.5" dy="21">Project Layer</tspan></text><line x1="736" y1="743" x2="761" y2="743" stroke="#1e40af" stroke-width="3" marker-end="url(#a)"/><rect x="761" y="720" width="190" height="46" rx="7" fill="#f8fafc" stroke="#93c5fd"/><text x="856.0" y="738" class="s" text-anchor="middle"><tspan x="856.0" dy="0">Read Personal Layer</tspan><tspan x="856.0" dy="21">when needed</tspan></text><line x1="958" y1="743" x2="983" y2="743" stroke="#1e40af" stroke-width="3" marker-end="url(#a)"/><rect x="983" y="720" width="150" height="46" rx="7" fill="#f8fafc" stroke="#93c5fd"/><text x="1058.0" y="738" class="s" text-anchor="middle"><tspan x="1058.0" dy="0">Compress into</tspan><tspan x="1058.0" dy="21">shorter rules</tspan></text><text x="600" y="825" class="note" text-anchor="middle">Core idea: AI is a coworker, not an external brain that replaces your thinking.</text></svg>